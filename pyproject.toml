[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "internal-ops-mcp"
version = "0.1.0"
description = "Local MCP server for a fictional company's help center and ticket queue."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.30,<2",
  "pydantic>=2",
]

[project.scripts]
internal-ops = "internal_ops_mcp.server:main"

[tool.setuptools.packages.find]
include = ["internal_ops_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
